<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Viewer</title>
        <style>
            body {
                background-color: white;
                margin: 0;
                padding: 2rem;
                display: flex;
                flex-direction: column;
                align-items: center;
                font-family: sans-serif;
            }
            .latex-document {
                width: 100%;
                max-width: 800px;
                border: none;
                min-height: 80vh;
            }
            .error-msg {
                color: #666;
                margin-top: 2rem;
            }
        </style>
    </head>
    <body>
        <div id="svg-container" class="latex-document"></div>

        <script>
            const params = new URLSearchParams(window.location.search);
            const noteId = params.get('note');
            const container = document.getElementById('svg-container');

            if (noteId) {
                let pageNum = 1;

                function loadNextPage() {
                    const svgPath = `notes/${noteId}-${pageNum}.svg`;

                    fetch(svgPath, { method: 'HEAD' })
                        .then(response => {
                            if (response.ok) {
                                const obj = document.createElement('object');
                                obj.data = svgPath;
                                obj.type = "image/svg+xml";
                                obj.className = "latex-document";
                                obj.style.marginBottom = "2rem";

                                obj.onload = function() {
                                    const svgDoc = obj.contentDocument;
                                    if (svgDoc) {
                                        svgDoc.querySelectorAll('a').forEach(a => {
                                            a.setAttribute('target', '_top');
                                            try {
                                                const bbox = a.getBBox();
                                                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                                                rect.setAttribute("x", bbox.x);
                                                rect.setAttribute("y", bbox.y);
                                                rect.setAttribute("width", bbox.width);
                                                rect.setAttribute("height", bbox.height);
                                                rect.setAttribute("fill", "transparent");
                                                rect.setAttribute("pointer-events", "all");
                                                a.insertBefore(rect, a.firstChild);
                                            } catch(e) {}
                                        });
                                    }

                                    pageNum++;
                                    loadNextPage();
                                };

                                container.appendChild(obj);
                            } else if (pageNum === 1) {
                                container.innerHTML = "<div class='error-msg'>Note not found or has not been compiled yet.</div>";
                            }
                        })
                        .catch(err => {
                            if (pageNum === 1) container.innerHTML = "<div class='error-msg'>Network error loading note.</div>";
                        });
                }

                loadNextPage();

            } else {
                container.innerHTML = "<div class='error-msg'>No note ID provided. Please use a link with ?note=ID</div>";
            }
        </script>
    </body>
</html>
